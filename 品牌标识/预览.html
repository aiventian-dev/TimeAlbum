<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>相机品牌标识</title><style>
body{margin:0;background:#100e0b;color:#efe7d6;font-family:"Songti SC","Baskerville",serif;padding:48px 40px 70px}
h1{font-size:19px;letter-spacing:.14em;font-weight:400;margin:0 0 8px}
p.note{font-size:12px;color:#8d8577;letter-spacing:.04em;margin:0 0 34px;max-width:600px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;
  background:rgba(239,231,214,.14);border:1px solid rgba(239,231,214,.14)}
figure{margin:0;background:#14120e;padding:24px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
figure img{width:120px;height:32px;object-fit:contain}
figcaption{font-size:11px;letter-spacing:.12em;color:#8d8577;text-align:center}
</style></head><body><h1>相机品牌标识</h1>
<p class="note">17 个品牌的官方矢量图标。viewBox 已按各自墨迹裁过，统一放进 120×32 的框里等比缩放（窄的居中偏右，字标型铺满宽度），所以看起来是同一视觉高度。每个品牌两个透明底文件：上单色（纸色 #efe7d6），下彩色（品牌色）。</p>
<div class="grid">
  <figure><img class="mono" src="apple-mono.svg" alt="Apple"><img class="col" src="apple-color.svg" alt=""><figcaption>Apple</figcaption></figure>
